<style>
:root{
  --bg:#121815; --card:#1C241F; --card2:#1F2B25; --line:#2C3830; --ink:#E6E2D6; --head:#F1EDE3;
  --ink2:#B9C2B4; --mute:#9FAA9C; --acc:#8FBF98; --accHi:#B5D9BC; --accInk:#10180F; --track:#2C3A31;
  --fill:#7DB088; --deep:#22352A; --deep2:#2C4535; --sun:#F1DDAE; --terra:#D9956A; --terraBg:#2E221B;
  --terraInk:#E8B08C; --gold:#D9A85A;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif; --sans:'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button,input,select{font-family:inherit;font-size:16px}
a{color:var(--acc)}a:hover{color:var(--accHi)}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{padding:calc(28px + env(safe-area-inset-top)) 22px 6px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;color:var(--head)}
h2{margin:0;font-family:var(--serif);font-weight:400;font-size:21px;color:var(--head)}
h3{margin:0;font-size:16px;font-weight:700;color:var(--head)}
p{margin:0;line-height:1.5}
.sub{font-size:16px;color:var(--ink2)}
.muted{color:var(--mute);font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.section{padding:0 14px;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.soft{background:var(--card2);border-color:transparent}
.card.deep{background:var(--deep);border-color:transparent;color:var(--head)}
.card.terra{background:var(--terraBg);border-color:transparent}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--fill);border-radius:99px}
.bar.gold>i{background:var(--gold)}
.big{font-family:var(--serif);font-size:42px;line-height:1;color:var(--head)}
.num{font-family:var(--serif);font-size:24px;color:var(--head)}
.btn{min-height:50px;border:none;border-radius:16px;background:var(--acc);color:var(--accInk);font-weight:700;cursor:pointer;padding:0 18px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--acc);color:var(--accHi)}
.btn.terra{background:var(--terra);color:#1A110B}
.btn.terraLine{background:transparent;border:1.5px solid var(--terra);color:var(--terraInk)}
.btn.small{min-height:44px;border-radius:13px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink2)}
.field input,.field select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#141B17;color:var(--ink);padding:0 12px;width:100%}
input[type=time],input[type=datetime-local]{color-scheme:dark}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{width:86px;text-align:center;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#141B17;color:var(--ink);font-size:17px;font-weight:700}
.extra{color:var(--gold);font-weight:700;font-size:13px}
.goal .head{display:flex;align-items:center;gap:10px}
.goal .head svg{flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#18201B;border-radius:14px;padding:10px 12px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center}
.banner{background:var(--terraBg);color:var(--terraInk);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(28,36,31,.97);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(8px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{min-height:56px;border:none;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accHi);font-weight:700}
.sheetWrap{position:fixed;inset:0;background:rgba(5,8,6,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.sheet .x{align-self:flex-end;margin:-8px -6px -10px 0}
.breathe{width:220px;height:220px;margin:12px auto;border-radius:50%;background:radial-gradient(circle,var(--acc) 0%,#4E7A58 60%,transparent 72%);transform:scale(.55);transition:transform 4s ease-in-out;opacity:.9}
.center{text-align:center}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:14px}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .dot{width:22px;height:22px;border-radius:50%;border:2px solid #4A5548;flex:none;display:flex;align-items:center;justify-content:center}
.tl .dot.done{background:var(--fill);border-color:var(--fill)}
.tl .dot.now{border:3px solid var(--fill)}
.tl .ln{width:2px;flex-grow:1;background:#34413A}
.tl .ln.done{background:var(--fill)}
.tl .tx{padding-bottom:16px;flex:1}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.3}
.badge .b{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#232C26;border:2px dashed #4A5548}
.badge.on .b{background:var(--track);border:2px solid var(--fill)}
.badge.on{font-weight:700;color:var(--head)}
.badge:not(.on){color:var(--mute)}
.seg{display:flex;background:#141B17;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:none;border-radius:10px;background:transparent;color:var(--ink2);font-weight:700;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--head);box-shadow:inset 0 0 0 1px var(--line)}
.metrics{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.metrics .chip{white-space:nowrap}
.chartWrap{position:relative}
.chartWrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#0E1310;border:1px solid var(--line);color:var(--head);padding:8px 10px;border-radius:10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:2}
.tip b{display:block;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:#18201B;border-radius:14px;padding:10px 12px}
.kpi .v{font-family:var(--serif);font-size:20px;color:var(--head)}
.kpi .l{font-size:12px;color:var(--mute)}
details summary{cursor:pointer;color:var(--acc);font-weight:700;min-height:44px;display:flex;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600}
.mood{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.mood button[aria-pressed="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
canvas.game{width:100%;height:340px;border-radius:18px;background:#0D1411;display:block;touch-action:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc);color:var(--accInk);padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.daynav{display:flex;align-items:center;gap:4px}
</style>

<script>
'use strict';
/* =========================================================
   Hain – persönliche Gesundheits-App
   Datenmodell ist versioniert (SCHEMA_VERSION + MIGRATIONS).
   Neue Felder in defaults() werden beim Laden automatisch
   ergänzt, bestehende Daten bleiben erhalten.
   ========================================================= */
const APP_VERSION = '1.1.0';
const SCHEMA_VERSION = 1;
const MIGRATIONS = {
  // Beispiel für spätere Versionen:
  // 1: s => { s.neuesFeld = ...; return s; },   // von Schema 1 auf 2
};

/* ---------- Hilfsfunktionen ---------- */
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDk = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmt = (n, dec = 0) => Number(n).toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const MON = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const MONL = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const fmtDate = d => `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`;
const fmtLong = d => `${WDL[d.getDay()]}, ${d.getDate()}. ${MONL[d.getMonth()]}`;
const tmin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const tstr = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${Math.floor(m / 60)}:${pad(m % 60)}`; };
const weekStart = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };
const todayK = () => dk(new Date());

function deepMerge(base, data) {
  if (Array.isArray(base)) return Array.isArray(data) ? data : base;
  if (base && typeof base === 'object') {
    const src = (data && typeof data === 'object' && !Array.isArray(data)) ? data : {};
    const out = { ...src };
    for (const k in base) out[k] = (k in src) ? deepMerge(base[k], src[k]) : structuredCloneSafe(base[k]);
    return out;
  }
  return data === undefined ? base : data;
}
function structuredCloneSafe(v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); }

/* ---------- Datenmodell ---------- */
function defaults() {
  return {
    schema: SCHEMA_VERSION,
    createdAt: new Date().toISOString(),
    onboarded: false,
    settings: {
      name: '', bed: '21:00', wake: '04:30', windDownMin: 45,
      goals: { walk: 30, water: 2.5, veg: 5, gymPerWeek: 4, sleepH: 7.5 },
      notify: { enabled: false, morning: true, day: true, evening: true, push: false },
      newsUrl: ''
    },
    days: {},
    smoke: { quitAt: null, perDay: 15, pricePerWeek: 10, cravings: [], slips: [] },
    rewards: [
      { id: 'r1', name: 'Kinoabend', price: 15, redeemedAt: null },
      { id: 'r2', name: 'Wellness-Tag', price: 60, redeemedAt: null },
      { id: 'r3', name: 'Neue Trainingsschuhe', price: 100, redeemedAt: null }
    ],
    garden: { landscape: 0, offsets: { schlaf: 0, bewegung: 0, ernaehrung: 0, rauchfrei: 0, kopf: 0 }, gallery: [], seedsBanked: 0, seedsSpent: 0, rare: [] },
    badges: {},
    news: { order: [], remote: [], fetchedOn: null },
    backup: { lastAt: null }
  };
}
function dayDefaults() {
  return { walk: 0, water: 0, veg: 0, gym: [], sleep: { bed: '', wake: '' }, morning: { water: false, stretch: false, light: false }, stretchDone: 0, breaths: 0, mood: 0 };
}
function migrate(s) {
  let v = s.schema || 1;
  while (v < SCHEMA_VERSION) { if (MIGRATIONS[v]) s = MIGRATIONS[v](s); v++; }
  s.schema = SCHEMA_VERSION;
  return s;
}

/* ---------- Speicher: IndexedDB + localStorage-Spiegel ---------- */
const DB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('hain', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  get(k) {
    return new Promise(res => {
      if (!this.db) return res(null);
      try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); } catch (e) { res(null); }
    });
  },
  set(k, v) {
    return new Promise(res => {
      if (!this.db) return res();
      try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); }
    });
  }
};
let S = null;
async function loadState() {
  await DB.open();
  let raw = await DB.get('state');
  if (!raw) { try { const ls = localStorage.getItem('hain-state'); if (ls) raw = JSON.parse(ls); } catch (e) { } }
  S = raw ? migrate(deepMerge(defaults(), raw)) : defaults();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const plain = JSON.parse(JSON.stringify(S));
    await DB.set('state', plain);
    try { localStorage.setItem('hain-state', JSON.stringify(plain)); } catch (e) { }
  }, 120);
}
function day(k) { S.days[k] = deepMerge(dayDefaults(), S.days[k] || {}); return S.days[k]; }
function peek(k) { return S.days[k] ? deepMerge(dayDefaults(), S.days[k]) : null; }

function seasonOf(d) { const m = d.getMonth(); return m === 11 || m < 2 ? 'winter' : m < 5 ? 'fruehling' : m < 8 ? 'sommer' : 'herbst'; }

function sleepMin(d) { if (!d || !d.sleep.bed || !d.sleep.wake) return null; const m = (tmin(d.sleep.wake) - tmin(d.sleep.bed) + 1440) % 1440; return m || null; }
const eveningM = t => (tmin(t) - 720 + 1440) % 1440; // Minuten ab 12 Uhr mittags
function onTimeBed(d) { return !!(d && d.sleep.bed) && eveningM(d.sleep.bed) <= eveningM(S.settings.bed) + 15; }

function smokeInfo() {
  const q = S.smoke.quitAt; if (!q) return null;
  const quit = new Date(q), now = new Date();
  const slips = S.smoke.slips.map(s => new Date(s.at)).filter(d => d >= quit).sort((a, b) => a - b);
  const runStart = slips.length ? slips[slips.length - 1] : quit;
  const slipDays = new Set(slips.map(dk)).size;
  const totalDays = Math.max(0, (now - quit) / 864e5);
  const freeDays = Math.max(0, totalDays - slipDays);
  const saved = freeDays * S.smoke.pricePerWeek / 7;
  const spent = S.rewards.filter(r => r.redeemedAt).reduce((a, r) => a + Number(r.price || 0), 0);
  return { quit, runStart, runMs: Math.max(0, now - runStart), freeDays, saved, spent, available: Math.max(0, saved - spent), cigs: freeDays * S.smoke.perDay, perDayEuro: S.smoke.pricePerWeek / 7, slipDays: new Set(slips.map(dk)) };
}

function dayXP(k, si) {
  const x = { schlaf: 0, bewegung: 0, ernaehrung: 0, rauchfrei: 0, kopf: 0 };
  const d = peek(k);
  if (d) {
    x.bewegung = Math.min(d.walk, 240) + d.gym.reduce((a, g) => a + 30 + Math.min(Number(g.min) || 0, 150) / 2, 0);
    x.ernaehrung = Math.min(d.water, 4) * 10 + Math.min(d.veg, 10) * 5;
    const sm = sleepMin(d);
    if (sm) { if (onTimeBed(d)) x.schlaf += 20; if (sm >= S.settings.goals.sleepH * 60 - 15) x.schlaf += 15; else if (sm >= 360) x.schlaf += 5; }
    x.kopf = (d.morning.water + d.morning.stretch + d.morning.light) * 5 + Math.min(d.stretchDone, 2) * 10 + Math.min(d.breaths, 3) * 5 + (d.mood ? 5 : 0);
  }
  if (si && !si.slipDays.has(k)) {
    const start = parseDk(k), end = addDays(start, 1), now = new Date();
    const a = Math.max(+start, +si.quit), b = Math.min(+end, +now);
    if (b > a) x.rauchfrei = (b - a) / 864e5 * 25;
    const cr = S.smoke.cravings.filter(c => dk(new Date(c.at)) === k).length;
    x.rauchfrei += Math.min(cr, 5) * 5;
  }
  for (const i in x) x[i] = Math.round(x[i]);
  return x;
}

let G = null; // berechneter Gesamtzustand
function computeAll() {
  const tk = todayK();
  const si = smokeInfo();
  let startK = dk(new Date(S.createdAt));
  const keys = Object.keys(S.days).sort();
  if (keys[0] && keys[0] < startK) startK = keys[0];
  if (si) { const qk = dk(si.quit); if (qk < startK) startK = qk; }
  const cum = { schlaf: 0, bewegung: 0, ernaehrung: 0, rauchfrei: 0, kopf: 0 };
  const off = S.garden.offsets; const xpByDay = {}; let total = 0, seeds = 0;
  for (let d = parseDk(startK); dk(d) <= tk; d = addDays(d, 1)) {
    const k = dk(d), x = dayXP(k, si); xpByDay[k] = x;
    for (const b of BEDS) {
      if (cum[b.id] - off[b.id] >= STAGE_T[5] * b.mult && x[b.id] > 0) seeds++;
      cum[b.id] += x[b.id]; total += x[b.id];
    }
  }
  const beds = BEDS.map(b => {
    const xp = cum[b.id] - off[b.id], s = stageOf(xp, b.mult);
    const next = s < 5 ? STAGE_T[s + 1] * b.mult : null, prev = STAGE_T[s] * b.mult;
    return { ...b, xp, stage: s, next, prev, pct: next ? (xp - prev) / (next - prev) : 1, bloom: s === 5 && (xpByDay[tk]?.[b.id] || 0) > 0, today: xpByDay[tk]?.[b.id] || 0 };
  });
  const level = levelOf(total);
  // Statistiken
  let onTime = 0, workouts = 0, walkMin = 0, waterGoal = 0, vegGoal = 0, morningDays = 0, moodDays = 0;
  for (const k of keys) {
    const d = peek(k); if (!d) continue;
    if (onTimeBed(d) && sleepMin(d)) onTime++;
    workouts += d.gym.length; walkMin += d.walk;
    if (d.water >= S.settings.goals.water) waterGoal++;
    if (d.veg >= S.settings.goals.veg) vegGoal++;
    if (d.morning.water && d.morning.stretch && d.morning.light) morningDays++;
    if (d.mood) moodDays++;
  }
  const st = { smokeDays: si ? si.freeDays : 0, runDays: si ? si.runMs / 864e5 : 0, onTime, workouts, walkMin, waterGoal, vegGoal, morningDays, moodDays, anyFull: beds.some(b => b.stage === 5), landscapes: S.garden.landscape };
  const animals = [
    { id: 'gluehwuermchen', name: 'Glühwürmchen', cond: '7 Nächte pünktlich im Bett', on: onTime >= 7, p: onTime / 7 },
    { id: 'igel', name: 'Igel', cond: '30 Tage rauchfrei', on: st.smokeDays >= 30, p: st.smokeDays / 30 },
    { id: 'rotkehlchen', name: 'Rotkehlchen', cond: '20 Trainings', on: workouts >= 20, p: workouts / 20 },
    { id: 'frosch', name: 'Frosch', cond: '14 Tage Stimmung eingetragen', on: moodDays >= 14, p: moodDays / 14 },
    { id: 'schmetterlinge', name: 'Schmetterlinge', cond: '14× Gemüseziel erreicht', on: vegGoal >= 14, p: vegGoal / 14 },
    { id: 'eichhoernchen', name: 'Eichhörnchen', cond: '50 Stunden spaziert', on: walkMin >= 3000, p: walkMin / 3000 },
  ];
  const decor = [
    { id: 'laterne', name: 'Steinlaterne', cond: 'Rang Gärtner (Level 5)', on: level >= 5 },
    { id: 'bach', name: 'Bachlauf', cond: 'Rang Hüter (Level 10)', on: level >= 10 },
    { id: 'bank', name: 'Gartenbank', cond: 'Rang Waldmeister (Level 20)', on: level >= 20 },
  ];
  const seedsTotal = seeds + S.garden.seedsBanked;
  G = { tk, si, xpByDay, total, level, rank: rankOf(level), lvlPct: (total - lvlStart(level)) / (lvlStart(level + 1) - lvlStart(level)), toNext: lvlStart(level + 1) - total, beds, st, animals, decor, seedsEarnedNow: seeds, seeds: seedsTotal - S.garden.seedsSpent, allFull: beds.every(b => b.stage === 5), season: seasonOf(new Date()) };
  G.event = seasonEvent();
  checkBadges();
  return G;
}

function seasonEvent() {
  const now = new Date(), s = G.season, y = now.getFullYear(), m = now.getMonth();
  let from, to;
  if (s === 'winter') { const sy = m === 11 ? y : y - 1; from = new Date(sy, 11, 1); to = new Date(sy + 1, 2, 0); }
  else if (s === 'fruehling') { from = new Date(y, 2, 1); to = new Date(y, 5, 0); }
  else if (s === 'sommer') { from = new Date(y, 5, 1); to = new Date(y, 8, 0); }
  else { from = new Date(y, 8, 1); to = new Date(y, 11, 0); }
  let v = 0;
  for (let d = new Date(from); d <= to && d <= now; d = addDays(d, 1)) {
    const x = peek(dk(d)); if (!x) continue;
    if (s === 'winter' && x.morning.water && x.morning.stretch && x.morning.light) v++;
    if (s === 'fruehling' && x.veg >= S.settings.goals.veg) v++;
    if (s === 'sommer') v += x.walk / 60;
    if (s === 'herbst' && x.walk >= 30) v++;
  }
  const E = {
    winter: ['Durch die dunklen Monate', 'Schaffe 45 komplette Morgenroutinen bis Ende Februar.', 45, 'Routinen', 'Winterlaterne'],
    fruehling: ['Große Blüte', 'Erreiche 30-mal dein Gemüseziel bis Ende Mai.', 30, 'Tage', 'Kirschblüte'],
    sommer: ['Lange Tage', 'Sammle 40 Stunden Spaziergang bis Ende August.', 40, 'Std', 'Sonnenblume'],
    herbst: ['Goldenes Laub', 'Mach 25 Spaziergänge von mindestens 30 Minuten bis Ende November.', 25, 'Spaziergänge', 'Goldahorn'],
  }[s];
  return { id: `ev-${s}-${from.getFullYear()}`, title: E[0], desc: E[1], goal: E[2], unit: E[3], prize: E[4], v: Math.floor(v), to, done: v >= E[2] };
}

    const x = 36 + (i * 72 / Math.max(1, er * 2 - 1)), hh = 7 + er * 2.4 + (i % 3) * 2;
    g += `<path d="M${x} 248 q${i % 2 ? 2 : -2} ${-hh / 2} 0 ${-hh}" stroke="${i % 2 ? leaf : '#8FBF98'}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if (er >= 4 && i % 3 === 0) g += `<circle cx="${x}" cy="${248 - hh - 2}" r="2" fill="${st.ernaehrung.bloom ? '#C9A0D8' : '#A88EC0'}"/>`;
  }
  if (an.schmetterlinge) g += `<path d="M110 222 c-6 -6 -8 2 0 2 c-8 0 -6 8 0 2" fill="#E8B08C"/><path d="M110 222 c6 -6 8 2 0 2 c8 0 6 8 0 2" fill="#E8B08C"/><path d="M40 216 c-5 -5 -6 2 0 2 c-6 0 -5 6 0 2 c5 4 6 -2 0 -2 c6 0 5 -7 0 -2z" fill="#D8DCEA"/>`;
  // Farn – Rauchfrei
  const rf = st.rauchfrei.stage;
  g += `<ellipse cx="160" cy="214" rx="38" ry="11" fill="#4A3A2A"/>`;
  if (rf === 0) g += `<circle cx="160" cy="210" r="2.5" fill="#8C7255"/>`;
  else {
    const n = rf + 1, L = 10 + rf * 6;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.42, ex = 160 + Math.cos(a) * L, ey = 212 + Math.sin(a) * L;
      const cx = 160 + Math.cos(a - 0.3) * L * .6, cy = 212 + Math.sin(a - 0.3) * L * .6;
      g += `<path d="M160 212 Q${cx} ${cy} ${ex} ${ey}" stroke="${i % 2 ? leaf2 : leaf}" stroke-width="${2 + rf * .5}" fill="none" stroke-linecap="round"/>`;
    }
    if (st.rauchfrei.bloom) g += `<circle cx="160" cy="${212 - L * .6}" r="${L * .8}" fill="#B5D9BC" opacity=".07"/>`;
  }
  // Seltene Pflanzen
  S.garden.rare.forEach((r, i) => { const x = 18 + i * 42, col = (RARE.find(z => z[0] === r) || ['', '#E6E2D6'])[1]; g += `<path d="M${x} 292 V280" stroke="#5F8466" stroke-width="2"/><circle cx="${x}" cy="278" r="3.6" fill="${col}"/>`; });
  if (de.laterne) g += `<rect x="118" y="168" width="4" height="22" fill="#6F6A5C"/><rect x="112" y="158" width="16" height="12" rx="2" fill="#6F6A5C"/><rect x="115" y="161" width="10" height="6" fill="#F1DDAE"/><circle cx="120" cy="164" r="14" fill="#F1DDAE" opacity=".1"/>`;
  if (de.bank) g += `<rect x="196" y="184" width="30" height="4" rx="1" fill="#8C7255"/><rect x="196" y="176" width="30" height="3" rx="1" fill="#8C7255"/><rect x="198" y="188" width="3" height="7" fill="#6B5038"/><rect x="221" y="188" width="3" height="7" fill="#6B5038"/>`;
  if (an.igel) g += `<ellipse cx="120" cy="272" rx="11" ry="7" fill="#6B5038"/><path d="M110 270 l2 -6 l3 5 l3 -7 l3 6 l3 -6 l3 6" stroke="#4A3A2A" stroke-width="2" fill="none"/><circle cx="131" cy="273" r="1.4" fill="#E6E2D6"/>`;
  if (an.gluehwuermchen) for (let i = 0; i < 9; i++) { const x = 30 + (i * 97) % 300, y = 120 + (i * 53) % 90; g += `<circle cx="${x}" cy="${y}" r="5" fill="#F1E08A" opacity=".15"/><circle cx="${x}" cy="${y}" r="1.6" fill="#F1E08A"/>`; }
  if (s === 'herbst') for (let i = 0; i < 7; i++) g += `<path d="M${40 + i * 45} ${130 + (i * 29) % 60} q4 -4 8 0 q-4 4 -8 0z" fill="#C9703F" opacity=".8"/>`;
  if (s === 'winter') for (let i = 0; i < 26; i++) g += `<circle cx="${(i * 61) % w}" cy="${(i * 43) % 200 + 20}" r="1.6" fill="#EEF2F3" opacity=".7"/>`;
  g += `</svg>`;
  return g;
}

function todaysNews() {
  const pool = [...(S.news.remote || []).filter(n => n && n.title), ...GOOD_NEWS.map(([title, text]) => ({ title, text }))];
  if (!S.news.order.length || S.news.order.length !== pool.length) {
    // gemischte Reihenfolge, damit sich nichts wiederholt, bis alle gezeigt wurden
    const idx = pool.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    S.news.order = idx; S.news.base = G.tk; save();
  }
  const n = Math.round((parseDk(G.tk) - parseDk(S.news.base || G.tk)) / 864e5);
  // aktuelle Nachrichten (remote) bevorzugen, wenn vorhanden
  const fresh = (S.news.remote || []).filter(x => x && x.title && x.date && (Date.now() - new Date(x.date)) < 7 * 864e5);
  if (fresh.length) return fresh[n % fresh.length];
  return pool[S.news.order[((n % pool.length) + pool.length) % pool.length]] || pool[0];
}

/* ---------- Verlauf / Graphen ---------- */
const METRICS = {
  walk: { name: 'Spaziergang', unit: 'Min', dec: 0, goal: () => S.settings.goals.walk },
  gym: { name: 'Gym', unit: 'Min', dec: 0, goal: () => null, sum: true },
  sleep: { name: 'Schlaf', unit: 'Std', dec: 1, goal: () => S.settings.goals.sleepH, tol: 0.25 },
  water: { name: 'Wasser', unit: 'l', dec: 1, goal: () => S.settings.goals.water },
  veg: { name: 'Obst & Gemüse', unit: 'Port.', dec: 1, goal: () => S.settings.goals.veg },
  xp: { name: 'XP', unit: 'XP', dec: 0, goal: () => null },
};
function metricVal(m, k) {
  const d = peek(k);
  if (m === 'sleep') { const s = sleepMin(d); return s ? s / 60 : null; }
  if (m === 'xp') { const x = G.xpByDay[k]; return x ? Object.values(x).reduce((a, c) => a + c, 0) : 0; }
  if (!d) return 0;
  if (m === 'gym') return d.gym.reduce((a, g) => a + (Number(g.min) || 0), 0);
  return Number(d[m]) || 0;
}
function buildSeries(m, range) {
  const sumAgg = METRICS[m].sum && (range === '90' || range === '365');
  const today = new Date(); const start = parseDk(dk(new Date(S.createdAt)));
  const valid = d => !(d < start && !S.days[dk(d)]);
  const B = [];
  if (range === '7' || range === '30') {
    const n = +range;
    for (let i = n - 1; i >= 0; i--) { const d = addDays(today, -i); B.push({ label: n === 7 ? WD[d.getDay()] : (i % 5 === 0 ? d.getDate() + '.' : ''), tip: fmtDate(d), days: valid(d) ? [dk(d)] : [] }); }
  } else if (range === '90') {
    const mon = weekStart(today);
    for (let i = 12; i >= 0; i--) { const ws = addDays(mon, -7 * i), days = []; for (let j = 0; j < 7; j++) { const d = addDays(ws, j); if (dk(d) <= dk(today) && valid(d)) days.push(dk(d)); } B.push({ label: i % 3 === 0 ? `${ws.getDate()}.${ws.getMonth() + 1}.` : '', tip: 'Woche ab ' + fmtDate(ws), days }); }
  } else {
    for (let i = 11; i >= 0; i--) { const mm = new Date(today.getFullYear(), today.getMonth() - i, 1), days = []; for (let d = new Date(mm); d.getMonth() === mm.getMonth() && dk(d) <= dk(today); d = addDays(d, 1)) if (valid(d)) days.push(dk(d)); B.push({ label: MON[mm.getMonth()].slice(0, i % 2 ? 0 : 3), tip: MONL[mm.getMonth()] + ' ' + mm.getFullYear(), days }); }
  }
  for (const b of B) { const vals = b.days.map(k => metricVal(m, k)).filter(v => v !== null); b.value = vals.length ? vals.reduce((a, c) => a + c, 0) / (sumAgg ? 1 : vals.length) : null; b.n = vals.length; }
  return B;
}
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
let chartData = [];
function chartSVG(B, M) {
  const W = 340, H = 210, L = 34, R = 8, T = 12, Bt = 24, pw = W - L - R, ph = H - T - Bt;
  const goal = M.goal(); const vals = B.map(b => b.value || 0);
  const max = niceMax(Math.max(...vals, goal || 0) * 1.08 || 1);
  const y = v => T + ph - v / max * ph; const slot = pw / B.length, bw = Math.max(3, Math.min(26, slot - 2));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(M.name)} im Verlauf">`;
  for (let i = 0; i <= 4; i++) { const v = max / 4 * i, yy = y(v); s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#2C3830" stroke-width="1"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#9FAA9C">${fmt(v, Number.isInteger(max / 4) ? 0 : 1)}</text>`; }
  B.forEach((b, i) => {
    const cx = L + slot * i + slot / 2;
    if (b.value) { const top = y(b.value), hgt = T + ph - top, r = Math.min(4, bw / 2, hgt); const x0 = cx - bw / 2, x1 = cx + bw / 2, yb = T + ph;
      const hit = goal && b.value >= goal - (M.tol || 0);
      s += `<path d="M${x0} ${yb} V${top + r} Q${x0} ${top} ${x0 + r} ${top} H${x1 - r} Q${x1} ${top} ${x1} ${top + r} V${yb}Z" fill="${hit ? '#8FBF98' : '#5E8A68'}"/>`; }
    if (b.label) s += `<text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="10" fill="#9FAA9C">${esc(b.label)}</text>`;
    s += `<rect x="${L + slot * i}" y="${T}" width="${slot}" height="${ph}" fill="transparent" data-i="${i}"/>`;
  });
  if (goal) { const gy = y(goal); s += `<line x1="${L}" x2="${W - R}" y1="${gy}" y2="${gy}" stroke="#D9A85A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - R}" y="${gy - 5}" text-anchor="end" font-size="10" font-weight="700" fill="#D9A85A">Ziel ${fmt(goal, M.dec)}</text>`; }
  s += `<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="#4A5548"/></svg>`;
  return s;
}
function renderVerlauf() {
  const M = METRICS[chart.metric]; const B = buildSeries(chart.metric, chart.range); chartData = B;
  const withData = B.filter(b => b.value !== null && b.n);
  const avg = withData.length ? withData.reduce((a, b) => a + b.value * b.n, 0) / withData.reduce((a, b) => a + b.n, 0) : 0;
  const allDays = B.flatMap(b => b.days); const goal = M.goal();
  const dayVals = allDays.map(k => metricVal(chart.metric, k)).filter(v => v !== null);
  const best = dayVals.length ? Math.max(...dayVals) : 0; const hits = goal ? dayVals.filter(v => v >= goal - (M.tol || 0)).length : null;
  const sum = dayVals.reduce((a, c) => a + c, 0);
  let gymInfo = '';
  if (chart.metric === 'gym') { const cnt = {}; let n = 0; allDays.forEach(k => { const d = peek(k); if (d) d.gym.forEach(g => { cnt[g.type] = (cnt[g.type] || 0) + 1; n++; }); }); gymInfo = `<div class="card"><h3>${n} Trainings im Zeitraum</h3><div class="chips">${Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([t, c]) => `<span class="chip" style="cursor:default;display:inline-flex;align-items:center">${esc(t)} · ${c}×</span>`).join('') || '<span class="muted">Noch keine Trainings.</span>'}</div></div>`; }
  const agg = M.sum ? (chart.range === '90' ? 'pro Woche' : chart.range === '365' ? 'pro Monat' : 'pro Tag') : (chart.range === '90' ? 'Ø pro Tag je Woche' : chart.range === '365' ? 'Ø pro Tag je Monat' : 'pro Tag');
  return `
  <header class="top"><h1>Verlauf</h1><p class="sub">Deine Entwicklung über die Zeit.</p></header>
  <div class="section">
    <div class="metrics" role="group" aria-label="Messwert">${Object.entries(METRICS).map(([k, m]) => `<button type="button" class="chip" data-a="metric" data-v="${k}" aria-pressed="${chart.metric === k}">${m.name}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="Zeitraum">${[['7', '7 Tage'], ['30', '30 Tage'], ['90', '3 Monate'], ['365', '1 Jahr']].map(([k, l]) => `<button type="button" data-a="range" data-v="${k}" aria-pressed="${chart.range === k}">${l}</button>`).join('')}</div>
    <div class="card">
      <div class="between"><h2>${esc(M.name)}</h2><span class="muted">${M.unit} ${agg}</span></div>
      <div class="chartWrap" id="chartWrap">${chartSVG(B, M)}<div class="tip" id="tip"></div></div>
      <div class="kpis">
        <div class="kpi"><div class="v">${fmt(avg, M.dec)}</div><div class="l">Ø ${M.unit}/Tag</div></div>
        <div class="kpi"><div class="v">${fmt(best, M.dec)}</div><div class="l">Bester Tag</div></div>
        <div class="kpi"><div class="v">${hits !== null ? `${hits}/${dayVals.length}` : fmt(sum, M.dec)}</div><div class="l">${hits !== null ? 'Tage Ziel erreicht' : 'Summe'}</div></div>
      </div>
      <details><summary>Als Tabelle anzeigen</summary><table><thead><tr><th>Zeitraum</th><th>${esc(M.unit)}</th></tr></thead><tbody>${B.map(b => `<tr><td>${esc(b.tip)}</td><td>${b.value === null ? '–' : fmt(b.value, M.dec)}</td></tr>`).join('')}</tbody></table></details>
    </div>
    ${gymInfo}
  </div>`;
}
function bindChart() {
  const wrap = document.getElementById('chartWrap'); if (!wrap) return; const tip = document.getElementById('tip'); const svg = wrap.querySelector('svg'); const M = METRICS[chart.metric];
  const show = e => {

function sheetStretch() {
  let i = 0, left = STRETCHES[0][2], timer = null, running = false;

    const [t, d] = STRETCHES[i];
    document.querySelector('.sheet').innerHTML = `<button class="iconbtn x" data-a="closeSheet" aria-label="Schließen">${ic('x')}</button>

      <button class="btn ghost small" data-a="stNext">${i === STRETCHES.length - 1 ? 'Fertig' : 'Nächste Übung'}</button>`;
  };

  const next = () => { if (i < STRETCHES.length - 1) { i++; left = STRETCHES[i][2]; draw(); } else finish(); };
  const finish = () => { clearInterval(timer); const d = day(todayK()); d.morning.stretch = true; d.stretchDone++; save(); closeSheet(); toast('Dehnroutine geschafft · +15 XP'); render(); };
  ACT.stToggle = () => { running = !running; clearInterval(timer); if (running) timer = setInterval(tick, 1000); draw(); };
  ACT.stNext = () => next();
  ACT.stPrev = () => { if (i > 0) { i--; left = STRETCHES[i][2]; draw(); } };
  sheetCleanup = () => clearInterval(timer);
}
function sheetBreathe() {
  const total = 180; let t = 0, timer, phase = 'ein';
  openSheet(`<h2>Atme mit dem Kreis</h2><p class="muted">4 Sekunden ein, 6 Sekunden aus. Langsames Ausatmen beruhigt dein Nervensystem.</p>
    <div class="breathe" id="circ"></div><div class="center" style="font-family:var(--serif);font-size:26px" id="phase">Einatmen</div><div class="center muted" id="bleft">3:00</div>
    <button class="btn ghost" data-a="closeSheet">Beenden</button>`);
  const c = () => document.getElementById('circ');
  const step = () => {
    if (!c()) return;
    const cyc = t % 10; const inh = cyc < 4;
    if (cyc === 0) { c().style.transitionDuration = '4s'; c().style.transform = 'scale(1)'; }
    if (cyc === 4) { c().style.transitionDuration = '6s'; c().style.transform = 'scale(.55)'; }
    document.getElementById('phase').textContent = inh ? 'Einatmen' : 'Ausatmen';
    const r = total - t; document.getElementById('bleft').textContent = `${Math.floor(r / 60)}:${pad(r % 60)}`;
    t++;
    if (t > total) { clearInterval(timer); const d = day(todayK()); d.breaths++; save(); closeSheet(); toast('Gut gemacht. Das Verlangen ist leiser geworden.'); render(); }
  };
  setTimeout(step, 50); timer = setInterval(step, 1000);
  sheetCleanup = () => clearInterval(timer);
}
function sheetGame() {
  openSheet(`<h2>Glühwürmchen fangen</h2><p class="muted">Tippe so viele Glühwürmchen an, wie du in 60 Sekunden schaffst.</p><canvas class="game" id="gc" aria-label="Spielfeld"></canvas><div class="between"><span id="gscore" class="num">0</span><span id="gtime" class="muted">60 s</span></div>`);
  const cv = document.getElementById('gc'), ctx = cv.getContext('2d'); const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  let flies = [], score = 0, end = performance.now() + 60000, raf, over = false;
  const spawn = () => flies.push({ x: Math.random() * (W - 40) + 20, y: Math.random() * (H - 40) + 20, vx: (Math.random() - .5) * 1.4, vy: (Math.random() - .5) * 1.4, r: 14 + Math.random() * 8, ph: Math.random() * 6, life: 0 });
  for (let i = 0; i < 5; i++) spawn();
  const loop = now => {
    ctx.clearRect(0, 0, W, H);
    const left = Math.max(0, (end - now) / 1000);
    flies.forEach(f => { f.x += f.vx; f.y += f.vy; f.ph += .08; if (f.x < 15 || f.x > W - 15) f.vx *= -1; if (f.y < 15 || f.y > H - 15) f.vy *= -1; const a = .55 + Math.sin(f.ph) * .45;
      const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 2); gr.addColorStop(0, `rgba(241,224,138,${a})`); gr.addColorStop(1, 'rgba(241,224,138,0)'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 2, 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(255,245,190,${a})`; ctx.beginPath(); ctx.arc(f.x, f.y, 3.5, 0, 7); ctx.fill(); });
    const st = document.getElementById('gtime'); if (st) st.textContent = Math.ceil(left) + ' s';
    if (left <= 0) { over = true; ctx.fillStyle = '#E6E2D6'; ctx.font = '600 22px Fraunces, Georgia, serif'; ctx.textAlign = 'center'; ctx.fillText(`${score} gefangen – stark!`, W / 2, H / 2); return; }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  cv.addEventListener('pointerdown', e => {
    if (over) return; const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const i = flies.findIndex(f => Math.hypot(f.x - x, f.y - y) < f.r + 12);
    if (i >= 0) { flies.splice(i, 1); score++; document.getElementById('gscore').textContent = score; spawn(); if (score % 4 === 0) spawn(); }
  });
  sheetCleanup = () => cancelAnimationFrame(raf);
}

/* ---------- Backup ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'hain', exportedAt: new Date().toISOString(), state: S }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `hain-backup-${todayK()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  S.backup.lastAt = new Date().toISOString(); save(); toast('Backup gespeichert'); render();
}
function importData(file) {
  if (!file) return; const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result); const st = j.state || j; if (!st.days || !st.settings) throw new Error('kein Hain-Backup');
      S = migrate(deepMerge(defaults(), st)); S.onboarded = true; save(); toast('Backup wiederhergestellt'); render();
    } catch (e) { toast('Diese Datei ist kein gültiges Backup'); }
  };
  r.readAsText(file);
}

/* ---------- Benachrichtigungen ---------- */
let notifyTimers = [];
async function notify(title, body, force) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (!force && !S.settings.notify.enabled) return;
  try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) { reg.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: title }); return; } } catch (e) { }
  try { new Notification(title, { body, icon: 'icon-192.png' }); } catch (e) { }
}
function scheduleNotifications() {
  notifyTimers.forEach(clearTimeout); notifyTimers = [];
  if (!S || !S.settings.notify.enabled || S.settings.notify.push) return;
  const n = S.settings.notify, now = new Date(), base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const at = (m, title, body) => { const t = new Date(+base + m * 6e4); const key = 'hain-n-' + dk(t) + '-' + m; if (t > now) notifyTimers.push(setTimeout(() => { try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) { } computeAll(); notify(title, typeof body === 'function' ? body() : body); }, t - now)); };
  const wake = tmin(S.settings.wake), bed = tmin(S.settings.bed);
  if (n.morning) at(wake + 10, 'Guten Morgen', () => { const si = G.si; return `${si ? `Seit ${durStr(si.runMs)} rauchfrei. ` : ''}Glas Wasser, 5 Minuten dehnen – und dann die gute Nachricht des Tages.`; });
  if (n.day) {
    at(9 * 60 + 30, 'Wusstest du?', () => BENEFITS[Math.floor(Math.random() * BENEFITS.length)]);
    at(12 * 60 + 30, 'Zeit für frische Luft', () => { const d = peek(todayK()); const w = d ? d.walk : 0; return w >= S.settings.goals.walk ? `Schon ${w} Minuten unterwegs – jede Minute mehr zählt extra.` : `Ein Spaziergang nach dem Essen tut gut. Bisher heute: ${w} Min.`; });
    at(16 * 60, 'Dein Fortschritt', () => { const si = G.si; return si ? `${fmt(si.saved, 2)} € gespart und ${fmt(si.cigs)} Zigaretten nicht geraucht. Dein Farn wächst.` : 'Dein Garten wächst mit jeder gesunden Entscheidung.'; });
  }
  if (n.evening) {
    at(bed - S.settings.windDownMin, 'Zeit zum Runterfahren', 'Bildschirm dimmen, Licht runter, kurz den Tag eintragen. Dein Schlafbeet freut sich.');
    at(bed - 5, 'Gleich Licht aus', `Licht aus um ${S.settings.bed} – morgen um ${S.settings.wake} startest du ausgeschlafen.`);
  }
  // Nach Mitternacht neu planen
  notifyTimers.push(setTimeout(scheduleNotifications, +addDays(base, 1) - now + 5000));
}

/* ---------- Push-Dienst ---------- */
function b64urlToBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function pushConnect() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return toast('Push wird hier nicht unterstützt. Öffne die App vom Homescreen.');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) { const cfg = await (await fetch('push-config.json', { cache: 'no-store' })).json(); sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(cfg.vapidPublicKey) }); }
    S.settings.notify.push = true; save(); scheduleNotifications();
    openSheet(`<h2>Push-Code</h2><p style="color:var(--ink2)">Kopiere diesen Code und speichere ihn in GitHub unter <b>Settings → Secrets and variables → Actions → New repository secret</b> mit dem Namen <b>PUSH_SUBSCRIPTION</b>.</p>
      <textarea id="subCode" readonly style="width:100%;min-height:150px;border-radius:12px;border:1.5px solid var(--line);background:#141B17;color:var(--ink);padding:10px;font-size:12px;font-family:ui-monospace,monospace">${esc(JSON.stringify(sub))}</textarea>
      <button class="btn" data-a="copySub">Code kopieren</button><button class="btn ghost" data-a="closeSheet">Fertig</button>`);
  } catch (e) { toast('Verbinden hat nicht geklappt: ' + (e.message || e)); }
}

/* ---------- Nachrichten-Feed ---------- */
async function fetchNews(force) {
  const url = S.settings.newsUrl || (location.protocol.startsWith('http') ? 'news.json' : ''); if (!url) return;
  if (!force && S.news.fetchedOn === todayK()) return;
  try {
    const r = await fetch(url, { cache: 'no-store' }); const j = await r.json(); const list = Array.isArray(j) ? j : j.items || [];
    S.news.remote = list.filter(x => x && x.title).slice(0, 200).map(x => ({ title: String(x.title), text: String(x.text || x.summary || ''), url: x.url || '', date: x.date || todayK(), source: x.source ? String(x.source) : '', lang: x.lang || 'de' }));
    S.news.fetchedOn = todayK(); S.news.order = []; save(); if (tab === 'heute') render();
  } catch (e) { }
}

/* ---------- Kleinkram ---------- */
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
let actx = null;
function beep() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 660; o.type = 'sine'; g.gain.setValueAtTime(.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(.2, actx.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .5); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .55); if (navigator.vibrate) navigator.vibrate(120); } catch (e) { } }

// Live-Zähler und Tageswechsel
let lastDay = todayK();
setInterval(() => {
  if (!S || !S.onboarded) return;
  if (todayK() !== lastDay) { if (sel === lastDay) sel = todayK(); lastDay = todayK(); render(); return; }
  const si = smokeInfo(); if (!si) return;
  ['liveRun', 'liveRun2'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = durStr(si.runMs); });
}, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S && S.onboarded && !document.querySelector('.sheetWrap')) { if (todayK() !== lastDay) { sel = todayK(); lastDay = todayK(); } render(); } });

/* ---------- Start ---------- */
(async () => {
  await loadState();
  render();
  scheduleNotifications();
  fetchNews(false);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }
})();
</script>
