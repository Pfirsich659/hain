name: Gute Nachrichten
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/news.mjs
      - name: Speichern
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "hain-bot"
            git config user.email "hain-bot@users.noreply.github.com"
            git add news.json
            git commit -m "Gute Nachrichten aktualisiert"
            git push
          else
            echo "Keine Änderungen."
          fi
